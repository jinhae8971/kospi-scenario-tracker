name: KOSPI scenario tracker

on:
  schedule:
    # 평일 KST 17:23 — 장 마감 15:30 + KRX 정산 버퍼.
    # 정각/30분은 러너 혼잡으로 스케줄이 몇 시간씩 밀리므로 비정각으로 분산한다.
    - cron: "23 8 * * 1-5"
    # KST 20:41 — 따라잡기 실행. 수집 로직이 멱등이라 1차가 정상이면 커밋 없이 끝난다.
    - cron: "41 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "특정 일자 강제 수집 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        default: ""
      force_notify:
        description: "신규 관측이 없어도 요약 알림을 강제 발송 (알림 경로 점검용)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read   # 실패 알림에서 실패 단계명을 조회하기 위함

concurrency:
  group: kospi-tracker
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: 계산 코어 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 의존성 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 유닛 테스트 + JS/Python 패리티
        run: python -m unittest discover -s tests -v

  track:
    name: 종가 수집 및 시나리오 갱신
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # pip 캐시 비활성: 설치를 --no-cache-dir 로 하므로 캐시할 대상이 없고,
          # Post 단계가 캐시 폴더 부재로 에러를 내 잡 전체를 실패로 만든다.

      - name: 의존성 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 종가 수집 및 시나리오 평가
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Seoul"
          # 셸 인젝션 방지: 사용자 입력을 명령줄에 직접 보간하지 않는다
          TARGET_DATE: ${{ inputs.date }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: |
          set -euo pipefail
          if [[ -n "${TARGET_DATE}" && ! "${TARGET_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date 입력 형식 오류 (YYYY-MM-DD): ${TARGET_DATE}"
            exit 1
          fi
          python tracker.py "${TARGET_DATE}"

      - name: Pages 로 scenarios.json 동기화
        run: |
          set -euo pipefail
          cp scenarios.json docs/scenarios.json

      - name: 산출물 정합성 검증
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys, datetime as dt
          store = json.load(open("docs/data/history.json", encoding="utf-8"))
          hist = store["history"]
          dates = [r["date"] for r in hist]
          assert dates == sorted(dates), "history 정렬 깨짐"
          assert len(dates) == len(set(dates)), "중복 일자"
          assert all(r.get("kospi") is not None for r in hist), "종가 누락 행"
          v = store.get("verdict") or {}
          if v:
              tot = sum(s["posterior"] for s in v["scenarios"])
              assert abs(tot - 1.0) < 1e-3, f"사후확률 합 이상: {tot}"
          print(f"검증 통과 — {len(hist)}행, 최신 {dates[-1] if dates else '없음'}")
          PY

      - name: 데이터 커밋
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          git config user.name  "kospi-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/data/history.json docs/scenarios.json
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일 추정) — 커밋 생략"
            exit 0
          fi
          # 실행 시각이 아니라 실제로 반영된 최신 관측일을 커밋 메시지에 쓴다.
          # (따라잡기 실행은 오늘이 아닌 며칠 전 종가를 채울 수 있다)
          latest="$(python -c "import json;print(json.load(open('docs/data/history.json'))['history'][-1]['date'])")"
          git commit -m "data: ${latest} 종가 반영"
          for i in 1 2 3; do
            if git push; then
              echo "푸시 완료 (시도 ${i})"
              exit 0
            fi
            echo "푸시 경합 — rebase 후 재시도 (${i}/3)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"
          exit 1

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBS_API: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DASHBOARD_URL: "https://jinhae8971.github.io/kospi-scenario-tracker/"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          # pip 설치 단계에서 실패했을 수도 있으므로 파이썬 의존성 없이 curl/jq 로만 처리한다
          if [[ -z "${TELEGRAM_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::warning::텔레그램 자격증명 없음 — 알림 생략"
            exit 0
          fi

          # 어느 단계에서 깨졌는지까지 알려줘야 로그를 열지 않고도 1차 판단이 된다.
          # 스텝 결과가 API 에 반영되기까지 지연이 있어 짧게 재시도하고,
          # 조회가 끝내 실패해도 알림 자체는 반드시 나가야 하므로 오류를 흡수한다.
          step=""
          for attempt in 1 2 3; do
            resp="$(mktemp)"
            api_code="$(curl -sS --max-time 10 -o "${resp}" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "${JOBS_API}" || echo 000)"
            step="$(jq -r '[.jobs[]?.steps[]? | select(.conclusion=="failure") | .name] | first // empty' \
                    "${resp}" 2>/dev/null || true)"
            echo "실패단계 조회 ${attempt}/3 — HTTP ${api_code}, 결과='${step:-없음}'"
            rm -f "${resp}"
            [[ -n "${step}" ]] && break
            sleep 4
          done
          # HTML parse_mode 를 쓰므로 조회해 온 문자열은 반드시 이스케이프한다
          step="$(printf '%s' "${step}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"

          trigger="정기 실행"
          [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && trigger="수동 실행"

          text="$(printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n\n%s' \
            '❌ <b>코스피 트래커 실행 실패</b>' \
            "· 실패 단계 : ${step:-확인 불가}" \
            "· 대상 일자 : ${TARGET_DATE:-오늘(자동)}" \
            "· 실행 구분 : ${trigger} #${RUN_NUMBER} (시도 ${RUN_ATTEMPT})" \
            "· 발생 시각 : $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST" \
            '데이터는 커밋되지 않았습니다. 대시보드는 직전 값을 그대로 유지합니다.' \
            "🔗 <a href=\"${DASHBOARD_URL}\">대시보드</a>  ·  <a href=\"${RUN_URL}\">실행 로그</a>")"

          body="$(mktemp)"
          code="$(curl -sS --max-time 15 -o "${body}" -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "parse_mode=HTML" -d "disable_web_page_preview=true" || echo 000)"
          # 응답을 버리지 않고 ok/message_id 를 남겨야 "조용한 미전달"을 잡을 수 있다.
          # 응답 본문에 토큰은 포함되지 않으며, 필요한 필드만 추출해 출력한다.
          if [[ "${code}" == "200" ]] && grep -q '"ok":true' "${body}"; then
            mid="$(sed -n 's/.*"message_id":\([0-9]*\).*/\1/p' "${body}" | head -1)"
            echo "텔레그램 전송 확인 — HTTP ${code}, message_id=${mid:-?}, 실패단계=${step:-미상}"
          else
            desc="$(sed -n 's/.*"description":"\([^"]*\)".*/\1/p' "${body}" | head -1)"
            echo "::error::텔레그램 전송 실패 — HTTP ${code} ${desc:-응답없음}"
          fi
          rm -f "${body}"
