name: KOSPI scenario tracker

on:
  schedule:
    # 평일 KST 17:00 = UTC 08:00 (장 마감 15:30 + KRX 데이터 정산 버퍼)
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "특정 일자 강제 수집 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kospi-tracker
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: 계산 코어 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 의존성 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 유닛 테스트 + JS/Python 패리티
        run: python -m unittest discover -s tests -v

  track:
    name: 종가 수집 및 시나리오 갱신
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Collect close & evaluate scenarios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Seoul"
          # 셸 인젝션 방지: 사용자 입력을 명령줄에 직접 보간하지 않는다
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [[ -n "${TARGET_DATE}" && ! "${TARGET_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date 입력 형식 오류 (YYYY-MM-DD): ${TARGET_DATE}"
            exit 1
          fi
          python tracker.py "${TARGET_DATE}"

      - name: Sync scenarios.json to Pages
        run: |
          set -euo pipefail
          cp scenarios.json docs/scenarios.json

      - name: Verify output integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys, datetime as dt
          store = json.load(open("docs/data/history.json", encoding="utf-8"))
          hist = store["history"]
          dates = [r["date"] for r in hist]
          assert dates == sorted(dates), "history 정렬 깨짐"
          assert len(dates) == len(set(dates)), "중복 일자"
          assert all(r.get("kospi") is not None for r in hist), "종가 누락 행"
          v = store.get("verdict") or {}
          if v:
              tot = sum(s["posterior"] for s in v["scenarios"])
              assert abs(tot - 1.0) < 1e-3, f"사후확률 합 이상: {tot}"
          print(f"검증 통과 — {len(hist)}행, 최신 {dates[-1] if dates else '없음'}")
          PY

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name  "kospi-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/data/history.json docs/scenarios.json
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일 추정) — 커밋 생략"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) 종가 반영"
          for i in 1 2 3; do
            if git push; then
              echo "푸시 완료 (시도 ${i})"
              exit 0
            fi
            echo "푸시 경합 — rebase 후 재시도 (${i}/3)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"
          exit 1

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # pip 설치 단계에서 실패했을 수도 있으므로 파이썬 의존성 없이 curl 로 보낸다
          if [[ -n "${TELEGRAM_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
            curl -sS --max-time 15 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(printf '%s\n%s' '❌ 코스피 트래커 실행 실패' "${RUN_URL}")" \
              -o /dev/null || echo "텔레그램 알림 실패"
          else
            echo "텔레그램 자격증명 없음 — 알림 생략"
          fi
